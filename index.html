<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Химоид - Конструктор молекул</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1e2b3c;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        .table-panel {
            width: 240px;
            min-width: 240px;
            background: #0f1a26;
            padding: 12px 8px;
            overflow-y: auto;
            border-right: 2px solid #3a4c5e;
            box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10;
        }
        .table-panel h3 {
            color: #b0d0e0;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid #2a4050;
            padding-bottom: 8px;
        }
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            background: #0f1a26;
        }
        .element-cell {
            aspect-ratio: 1 / 1;
            background: #1a2a38;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #d4eaf5;
            cursor: pointer;
            transition: 0.1s ease;
            box-shadow: 0 0 0 1px #2a4050;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
            line-height: 1;
        }
        .element-cell:hover {
            background: #2a4a5e;
            transform: scale(1.05);
            box-shadow: 0 0 8px #5f8fa0;
            z-index: 5;
        }
        .element-cell:active {
            transform: scale(0.9);
        }
        .workspace {
            flex: 1;
            background: #1b2a36;
            position: relative;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, #2a4050 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, #2a4050 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }
        .chem-object {
            position: absolute;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #e6f3fa;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            cursor: grab;
            display: inline-block;
            white-space: nowrap;
            transition: filter 0.1s;
            letter-spacing: 0.5px;
            background: transparent;
            border: none;
            box-shadow: none;
            pointer-events: auto;
            z-index: 20;
        }
        .chem-object.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
            z-index: 100;
        }
        .chem-object:hover {
            filter: drop-shadow(0 0 10px #6aa0c0);
        }
        .info-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a1a22cc;
            backdrop-filter: blur(6px);
            color: #b0d0e0;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            border: 1px solid #2a5060;
            pointer-events: none;
            z-index: 200;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .info-bar span {
            color: #8fcbff;
            font-weight: 600;
        }
        .table-panel::-webkit-scrollbar {
            width: 4px;
        }
        .table-panel::-webkit-scrollbar-track {
            background: #0f1a26;
        }
        .table-panel::-webkit-scrollbar-thumb {
            background: #3a5a6e;
            border-radius: 10px;
        }

        .chem-tooltip {
            position: fixed;
            background: #0d1c2b;
            border: 1px solid #4a7a9a;
            border-radius: 12px;
            padding: 14px 18px;
            color: #d4eaf5;
            font-size: 14px;
            line-height: 1.6;
            max-width: 320px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .chem-tooltip.visible {
            opacity: 1;
        }
        .chem-tooltip .title {
            font-size: 18px;
            font-weight: 700;
            color: #b0e0ff;
            border-bottom: 1px solid #2a5060;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .chem-tooltip .prop {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .chem-tooltip .prop .label {
            color: #7a9aaa;
        }
        .chem-tooltip .prop .value {
            color: #c8e6f9;
            font-weight: 500;
        }
        .chem-tooltip .composition-detail {
            margin-top: 6px;
            font-size: 13px;
            color: #9ab8d0;
            background: #0a1a26;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .chem-tooltip .full-name {
            color: #f0d080;
            font-weight: 600;
            font-size: 15px;
            margin-top: 2px;
        }
    </style>

                Lu:3, Hf:4, Ta:5, W:6, Re:5, Os:4, Ir:4, Pt:4, Au:3, Hg:2,
                Tl:3, Pb:4, Bi:3, Po:4, At:1, Rn:0, Fr:1, Ra:2, Ac:3, Th:4,
                Pa:5, U:6, Np:5, Pu:4, Am:3, Cm:4, Bk:3, Cf:3, Es:3, Fm:3,
                Md:3, No:3, Lr:3, Rf:4, Db:5, Sg:4, Bh:3, Hs:4, Mt:3, Ds:3,
                Rg:3, Cn:2, Nh:3, Fl:4, Mc:3, Lv:4, Ts:3, Og:2
            };

            // ---- Генерация полного названия соединения по составу ----
            function generateCompoundName(composition) {
                if (!composition || composition.length < 2) {
                    const el = composition ? composition[0] : '';
                    return elementData[el]?.rus || el || 'Неизвестный';
                }
                // Разбираем состав на отдельные символы (поддерживает двухбуквенные)
                const tokens = [];
                let i = 0;
                while (i < composition.length) {
                    if (i+1 < composition.length && composition[i+1] >= 'a' && composition[i+1] <= 'z') {
                        tokens.push(composition.substring(i, i+2));
                        i += 2;
                    } else {
                        tokens.push(composition[i]);
                        i++;
                    }
                }
                // Строим название: для каждого токена берём русское название в родительном падеже (упрощённо)
                // Для оксидов, гидридов и т.д. делаем простую эвристику
                const names = tokens.map(sym => {
                    const data = elementData[sym];
                    return data ? data.rus : sym;
                });
                // Простейшая эвристика для оксидов: если есть O и другой элемент
                if (tokens.includes('O') && tokens.length === 2) {
                    const other = tokens.find(s => s !== 'O');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        // Оксид + родительный падеж (упрощённо)
                        return `Оксид ${otherName}`;
                    }
                }
                // Гидриды
                if (tokens.includes('H') && tokens.length === 2) {
                    const other = tokens.find(s => s !== 'H');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        return `Гидрид ${otherName}`;
                    }
                }
                // Хлориды
                if (tokens.includes('Cl') && tokens.length === 2) {
                    const other = tokens.find(s => s !== 'Cl');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        return `Хлорид ${otherName}`;
                    }
                }
                // Фториды
                if (tokens.includes('F') && tokens.length === 2) {
                    const other = tokens.find(s => s !== 'F');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        return `Фторид ${otherName}`;
                    }
                }
                // Если больше 2 элементов или сложный случай — просто перечисляем
                if (names.length <= 3) {
                    return names.join('') + ' (соединение)';
                }
                return names.join('') + ' (сложное соединение)';
            }

            let chemObjects = [];
            const workspace = document.getElementById('workspace');
            const grid = document.getElementById('periodicGrid');
            const tooltip = document.getElementById('tooltip');

            // ---- Заполняем таблицу ----
            elements.forEach(symbol => {
                const cell = document.createElement('div');
                cell.className = 'element-cell';
                cell.textContent = symbol;
                cell.dataset.symbol = symbol;
                grid.appendChild(cell);
            });

            // ---- Получение данных для подсказки ----
            function getTooltipData(symbol, composition) {
                const base = elementData[symbol] || { name: 'Неизвестный элемент', mass: '?', group: '?', rus: symbol };
                const val = valenceMap[symbol] !== undefined ? valenceMap[symbol] : 0;
                const isCompound = composition && composition.length > 1;
                const displayName = isCompound ? `Соединение (${composition})` : base.name;
                const group = isCompound ? 'Химическое соединение' : base.group;
                const mass = isCompound ? '—' : base.mass;
                const valenceStr = isCompound ? (valenceMap[composition] !== undefined ? valenceMap[composition] : val) : val;
                let fullName = isCompound ? generateCompoundName(composition) : base.rus;
                // Делаем первую букву заглавной
                if (fullName.length > 0) {
                    fullName = fullName.charAt(0).toUpperCase() + fullName.slice(1);
                }
                return {
                    symbol: symbol,
                    name: displayName,
                    mass: mass,
                    group: group,
                    valence: valenceStr,
                    composition: composition || symbol,
                    isCompound: isCompound,
                    fullName: fullName
                };
            }

            // ---- Показ подсказки ----
            function showTooltip(e, symbol, composition) {
                const data = getTooltipData(symbol, composition);
                let html = `<div class="title">${data.symbol} · ${data.name}</div>`;
                if (data.isCompound) {
                    html += `<div class="full-name">${data.fullName}</div>`;
                } else {
                    html += `<div class="full-name">${data.fullName}</div>`;
                }
                html += `<div class="prop"><span class="label">Группа</span><span class="value">${data.group}</span></div>`;
                if (data.mass !== '—') {
                    html += `<div class="prop"><span class="label">Атомная масса</span><span class="value">${data.mass}</span></div>`;
                }
                html += `<div class="prop"><span class="label">Валентность</span><span class="value">${data.valence}</span></div>`;
                if (data.isCompound) {
                    html += `<div class="composition-detail">Состав: ${data.composition}</div>`;
                } else {
                    html += `<div class="composition-detail">${data.symbol}</div>`;
                }
                tooltip.innerHTML = html;

                const tx = e.clientX + 16;
                const ty = e.clientY + 16;
                let left = tx;
                let top = ty;
                const tw = tooltip.offsetWidth || 320;
                const th = tooltip.offsetHeight || 220;
                if (left + tw > window.innerWidth - 10) left = e.clientX - tw - 10;
                if (top + th > window.innerHeight - 10) top = e.clientY - th - 10;
                if (left < 10) left = 10;
                if (top < 10) top = 10;
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
                tooltip.classList.add('visible');
            }

            function hideTooltip() {
                tooltip.classList.remove('visible');
            }

            // ---- Создание элемента ----
            function createChemObject(symbol, x, y) {
                const el = document.createElement('div');
                el.className = 'chem-object';
                el.textContent = symbol;
                el.dataset.symbol = symbol;
                el.dataset.composition = symbol;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                workspace.appendChild(el);
                chemObjects.push(el);
                attachDragEvents(el);
                attachTooltipEvents(el);
                return el;
            }

            // ---- Подсказки ----
            function attachTooltipEvents(el) {
                el.addEventListener('mouseenter', (e) => {
                    const symbol = el.dataset.symbol;
                    const composition = el.dataset.composition || symbol;
                    showTooltip(e, symbol, composition);
                });
                el.addEventListener('mousemove', (e) => {
                    const symbol = el.dataset.symbol;
                    const composition = el.dataset.composition || symbol;
                    showTooltip(e, symbol, composition);
                });
                el.addEventListener('mouseleave', hideTooltip);
            }

            // ---- Перетаскивание ----
            function attachDragEvents(el) {
                let isDragging = false;
                let startX, startY, origX, origY;

                const onStart = (e) => {
                    e.preventDefault();
                    const ev = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    el.classList.add('dragging');
                    const rect = el.getBoundingClientRect();
                    origX = rect.left;
                    origY = rect.top;
                    startX = ev.clientX;
                    startY = ev.clientY;
                    el.style.zIndex = 100;
                    hideTooltip();

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd, { passive: false });
                };

                const onMove = (e) => {
                    e.preventDefault();
                    if (!isDragging) return;
                    const ev = e.touches ? e.touches[0] : e;
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    const wsRect = workspace.getBoundingClientRect();
                    let newX = origX + dx - wsRect.left;
                    let newY = origY + dy - wsRect.top;
                    newX = Math.max(0, Math.min(wsRect.width - el.offsetWidth, newX));
                    newY = Math.max(0, Math.min(wsRect.height - el.offsetHeight, newY));
                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                };

                const onEnd = (e) => {
                    if (isDragging) {
                        isDragging = false;
                        el.classList.remove('dragging');
                        el.style.zIndex = 20;
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        checkAndMerge(el);
                    }
                };

                el.addEventListener('mousedown', onStart);
                el.addEventListener('touchstart', onStart, { passive: false });
            }

            // ---- Соединение ----
            function checkAndMerge(draggedEl) {
                const dragRect = draggedEl.getBoundingClientRect();
                const dragSymbol = draggedEl.dataset.symbol;
                const dragComposition = draggedEl.dataset.composition || dragSymbol;
                const dragVal = valenceMap[dragSymbol] || 0;
                if (dragVal === 0) return;

                for (let other of chemObjects) {
                    if (other === draggedEl) continue;
                    const otherRect = other.getBoundingClientRect();
                    const overlap = !(dragRect.right < otherRect.left || 
                                     dragRect.left > otherRect.right || 
                                     dragRect.bottom < otherRect.top || 
                                     dragRect.top > otherRect.bottom);
                    if (!overlap) continue;

                    const otherSymbol = other.dataset.symbol;
                    const otherVal = valenceMap[otherSymbol] || 0;
                    if (otherVal === 0) continue;

                    const newComposition = dragComposition + otherSymbol;
                    const centerX = (dragRect.left + dragRect.right) / 2 - 20;
                    const centerY = (dragRect.top + dragRect.bottom) / 2 - 12;
                    const wsRect = workspace.getBoundingClientRect();
                    const newX = Math.max(0, Math.min(wsRect.width - 40, centerX - wsRect.left));
                    const newY = Math.max(0, Math.min(wsRect.height - 30, centerY - wsRect.top));

                    removeObject(draggedEl);
                    removeObject(other);

                    const firstSymbol = dragComposition[0] || '?';
                    const newEl = createChemObject(firstSymbol, newX, newY);
                    newEl.dataset.composition = newComposition;
                    newEl.textContent = newComposition;
                    const newVal = Math.max(dragVal, otherVal);
                    valenceMap[newComposition] = newVal;
                    valenceMap[firstSymbol] = newVal;
                    newEl.dataset.symbol = firstSymbol;
                    return;
                }
            }

            // ---- Удаление ----
            function removeObject(el) {
                const index = chemObjects.indexOf(el);
                if (index !== -1) {
                    chemObjects.splice(index, 1);
                }
                if (el.parentNode) el.parentNode.removeChild(el);
            }

            // ---- Создание по клику ----
            grid.addEventListener('click', (e) => {
                const cell = e.target.closest('.element-cell');
                if (!cell) return;
                const symbol = cell.dataset.symbol;
                const wsRect = workspace.getBoundingClientRect();
                const x = wsRect.width/2 - 20 + (Math.random() * 120 - 60);
                const y = wsRect.height/2 - 12 + (Math.random() * 120 - 60);
                const el = createChemObject(symbol, x, y);
                el.dataset.composition = symbol;
            });

            // ---- Скрываем подсказку ----
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.chem-object') && !e.target.closest('.element-cell')) {
                    hideTooltip();
                }
            });

            // ---- Демо ----
            function initDemo() {
                const wsRect = workspace.getBoundingClientRect();
                const demoElements = ['H', 'O', 'C', 'N', 'Cl', 'Na'];
                demoElements.forEach((sym, i) => {
                    const angle = (i / demoElements.length) * 2 * Math.PI;
                    const radius = 90;
                    const cx = wsRect.width/2;
                    const cy = wsRect.height/2;
                    const x = cx + Math.cos(angle) * radius - 16;
                    const y = cy + Math.sin(angle) * radius - 12;
                    const el = createChemObject(sym, x, y);
                    el.dataset.composition = sym;
                });
            }

            setTimeout(initDemo, 100);
        })();
    </script>
</body>
</html>
