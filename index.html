<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химоид - Конструктор молекул</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1e2b3c;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        .table-panel {
            width: 590px;
            min-width: 340px;
            background: #0f1a26;
            padding: 12px 10px;
            overflow-y: auto;
            border-right: 2px solid #3a4c5e;
            box-shadow: 2px 0 12px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10;
        }
        .table-panel h3 {
            color: #b0d0e0;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #2a4050;
            padding-bottom: 8px;
        }
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 2px;
            background: #0f1a26;
        }
        .element-cell {
            aspect-ratio: 1 / 1;
            background: #1a2a38;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            color: #d4eaf5;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 0 0 1px #2a4050;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
            line-height: 1.1;
            padding: 1px;
            position: relative;
        }
        .element-cell .el-number {
            font-size: 6px;
            color: #6a8a9a;
            font-weight: 400;
        }
        .element-cell .el-symbol {
            font-size: 13px;
            font-weight: 700;
            color: #e6f3fa;
        }
        .element-cell .el-name {
            font-size: 5.5px;
            color: #8aacbe;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .element-cell:hover {
            background: #2a4a5e;
            transform: scale(1.15);
            box-shadow: 0 0 12px #5f8fa0;
            z-index: 5;
        }
        .element-cell:active {
            transform: scale(0.9);
        }
        /* Цвета по типам */
        .element-cell.nonmetal { background: #1a3a2a; }
        .element-cell.noble-gas { background: #2a2a4a; }
        .element-cell.alkali { background: #3a2a2a; }
        .element-cell.alkaline-earth { background: #3a2a3a; }
        .element-cell.metalloid { background: #2a3a2a; }
        .element-cell.halogen { background: #2a2a3a; }
        .element-cell.transition { background: #1a2a3a; }
        .element-cell.lanthanide { background: #2a1a3a; }
        .element-cell.actinide { background: #2a1a2a; }
        .element-cell.post-transition { background: #1a2a2a; }

        .coefficient-panel {
            margin-top: 10px;
            padding: 8px 4px;
            background: #0a1722;
            border-radius: 8px;
            border: 1px solid #1a3040;
        }
        .coefficient-panel .label {
            color: #7a9aaa;
            font-size: 11px;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .coefficient-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
        }
        .coeff-cell {
            aspect-ratio: 1 / 1;
            background: #1a2a38;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #ffd866;
            cursor: pointer;
            transition: 0.1s ease;
            box-shadow: 0 0 0 1px #2a4050;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
        }
        .coeff-cell:hover {
            background: #2a4a5e;
            transform: scale(1.05);
            box-shadow: 0 0 8px #5f8fa0;
            z-index: 5;
        }
        .coeff-cell:active {
            transform: scale(0.9);
        }
        .workspace {
            flex: 1;
            background: #1b2a36;
            position: relative;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, #2a4050 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, #2a4050 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }
        .chem-object {
            position: absolute;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #e6f3fa;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            cursor: grab;
            display: inline-block;
            white-space: nowrap;
            transition: filter 0.1s, transform 0.1s, box-shadow 0.2s;
            letter-spacing: 0.5px;
            background: transparent;
            border: none;
            box-shadow: none;
            pointer-events: auto;
            z-index: 20;
        }
        .chem-object.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
            z-index: 100;
            transform: scale(1.05);
        }
        .chem-object:hover {
            filter: drop-shadow(0 0 10px #6aa0c0);
        }
        .chem-object.compound {
            color: #ffd866;
            font-size: 14px;
            background: rgba(255, 216, 102, 0.08);
            border: 1px solid rgba(255, 216, 102, 0.15);
            padding: 3px 10px;
        }
        .chem-object.mega-compound {
            color: #ff8a8a;
            font-size: 13px;
            background: rgba(255, 138, 138, 0.08);
            border: 1px solid rgba(255, 138, 138, 0.15);
            padding: 3px 10px;
        }
        .chem-object.alloy {
            color: #80d0ff;
            font-size: 14px;
            background: rgba(128, 208, 255, 0.08);
            border: 1px solid rgba(128, 208, 255, 0.15);
            padding: 3px 10px;
        }
        .chem-object.reject {
            color: #ff5555 !important;
            background: rgba(255, 50, 50, 0.25) !important;
            border: 1px solid #ff3333 !important;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transition: all 0.1s;
        }
        .chem-object.coefficient {
            color: #ffd866;
            font-size: 20px;
            font-weight: 800;
            background: rgba(255, 216, 102, 0.15);
            border: 2px solid #ffd866;
            padding: 2px 12px;
            border-radius: 12px;
            min-width: 40px;
            text-align: center;
            cursor: grab;
            box-shadow: 0 0 20px rgba(255, 216, 102, 0.2);
        }
        .chem-object.coefficient.dragging {
            box-shadow: 0 0 40px rgba(255, 216, 102, 0.5);
            transform: scale(1.2);
        }
        .info-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a1a22cc;
            backdrop-filter: blur(6px);
            color: #b0d0e0;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            border: 1px solid #2a5060;
            pointer-events: none;
            z-index: 200;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .info-bar span {
            color: #8fcbff;
            font-weight: 600;
        }
        .info-bar .compound-count {
            color: #ffd866;
        }
        .table-panel::-webkit-scrollbar {
            width: 4px;
        }
        .table-panel::-webkit-scrollbar-track {
            background: #0f1a26;
        }
        .table-panel::-webkit-scrollbar-thumb {
            background: #3a5a6e;
            border-radius: 10px;
        }
        /* ---- ПОДСКАЗКА ДЛЯ ЭЛЕМЕНТОВ В ТАБЛИЦЕ ---- */
        .element-tooltip {
            position: fixed;
            background: #0d1c2b;
            border: 1px solid #4a7a9a;
            border-radius: 12px;
            padding: 16px 20px;
            color: #d4eaf5;
            font-size: 14px;
            line-height: 1.7;
            max-width: 320px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .element-tooltip.visible {
            opacity: 1;
        }
        .element-tooltip .el-title {
            font-size: 22px;
            font-weight: 700;
            color: #b0e0ff;
            border-bottom: 1px solid #2a5060;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .element-tooltip .el-title .el-sym {
            color: #ffd866;
            font-size: 28px;
        }
        .element-tooltip .el-sub {
            color: #8aacbe;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .element-tooltip .prop {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 2px 0;
        }
        .element-tooltip .prop .label {
            color: #7a9aaa;
        }
        .element-tooltip .prop .value {
            color: #c8e6f9;
            font-weight: 500;
        }
        .element-tooltip .prop .value.highlight {
            color: #ffd866;
        }
        .element-tooltip .type-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 4px;
        }
        .element-tooltip .type-tag.nonmetal { background: #1a3a2a; color: #8fdaa0; }
        .element-tooltip .type-tag.noble-gas { background: #2a2a4a; color: #a0a0da; }
        .element-tooltip .type-tag.alkali { background: #3a2a2a; color: #da8f8f; }
        .element-tooltip .type-tag.alkaline-earth { background: #3a2a3a; color: #da8fda; }
        .element-tooltip .type-tag.metalloid { background: #2a3a2a; color: #8ada8a; }
        .element-tooltip .type-tag.halogen { background: #2a2a3a; color: #8a8ada; }
        .element-tooltip .type-tag.transition { background: #1a2a3a; color: #8ab0da; }
        .element-tooltip .type-tag.lanthanide { background: #2a1a3a; color: #b08ada; }
        .element-tooltip .type-tag.actinide { background: #2a1a2a; color: #da8ada; }
        .element-tooltip .type-tag.post-transition { background: #1a2a2a; color: #8adada; }

        .clear-btn {
            background: #1a3040;
            border: 1px solid #3a5a6e;
            color: #b0d0e0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            transition: 0.2s;
            width: 100%;
        }
        .clear-btn:hover {
            background: #2a4a5e;
            border-color: #6aa0c0;
        }
        .stats-bar {
            color: #5a7a8a;
            font-size: 11px;
            text-align: center;
            padding: 6px 0;
            border-top: 1px solid #1a3040;
            margin-top: 6px;
        }
        .stats-bar span {
            color: #8fcbff;
        }
        .chem-tooltip {
            position: fixed;
            background: #0d1c2b;
            border: 1px solid #4a7a9a;
            border-radius: 12px;
            padding: 14px 18px;
            color: #d4eaf5;
            font-size: 14px;
            line-height: 1.6;
            max-width: 450px;

            box-shadow: 0 12px 32px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .chem-tooltip.visible {
            opacity: 1;
        }
        .chem-tooltip .title {
            font-size: 18px;
            font-weight: 700;
            color: #b0e0ff;
            border-bottom: 1px solid #2a5060;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .chem-tooltip .prop {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 2px 0;
        }
        .chem-tooltip .prop .label {
            color: #7a9aaa;
        }
        .chem-tooltip .prop .value {
            color: #c8e6f9;
            font-weight: 500;
        }
        .chem-tooltip .prop .value.highlight {
            color: #ffd866;
        }
        .chem-tooltip .full-name {
            color: #f0d080;
            font-weight: 600;
            font-size: 15px;
            margin-top: 2px;
        }
        .chem-tooltip .type-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 4px;
            margin-right: 4px;
        }
        .chem-tooltip .type-tag.organic { background: #2a4a3a; color: #8fdaa0; }
        .chem-tooltip .type-tag.inorganic { background: #3a3a5a; color: #a0a0da; }
        .chem-tooltip .type-tag.alloy { background: #2a3a5a; color: #80b0ff; }
        .chem-tooltip .type-tag.mixture { background: #3a4a3a; color: #80da80; }
        .chem-tooltip .type-tag.acid { background: #3a2a4a; color: #c080da; }
        .chem-tooltip .type-tag.salt { background: #2a3a4a; color: #80a0da; }
        .chem-tooltip .type-tag.oxide { background: #3a3a2a; color: #dada80; }
        .chem-tooltip .type-tag.hydride { background: #2a3a3a; color: #80dada; }
        .chem-tooltip .state-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 4px;
            margin-right: 4px;
        }
        .chem-tooltip .state-tag.solid { background: #3a3a2a; color: #dada80; }
        .chem-tooltip .state-tag.liquid { background: #2a3a4a; color: #80aada; }
        .chem-tooltip .state-tag.gas { background: #3a2a2a; color: #da8080; }
        .chem-tooltip .element-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .chem-tooltip .element-list .el-tag {
            background: #1a3040;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #b0d0e0;
            border: 1px solid #2a5060;
        }
        .chem-tooltip .section-title {
            color: #8fcbff;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #1a3040;
        }
        .chem-tooltip .formula-display {
            font-size: 20px;
            font-weight: 700;
            color: #ffd866;
            text-align: center;
            padding: 4px 0;
            letter-spacing: 1px;
            background: rgba(255, 216, 102, 0.05);
            border-radius: 8px;
            margin: 4px 0;
        }
    </style>
</head>

        <h3>⚛️ ПЕРИОДИЧЕСКАЯ ТАБЛИЦА</h3>

        <div class="coefficient-panel">

    </div>
    <div class="workspace" id="workspace">

                }
                return counts;
            }

            function buildFormula(tokens) {
                const counts = {};
                let i = 0;
                while (i < tokens.length) {
                    const sym = tokens[i];
                    let count = 1;
                    if (i+1 < tokens.length && !isNaN(tokens[i+1])) {
                        count = parseInt(tokens[i+1]);
                        i++;
                    }
                    counts[sym] = (counts[sym] || 0) + count;
                    i++;
                }
                let result = '';
                const sorted = Object.keys(counts).sort();
                for (const sym of sorted) {
                    result += sym;
                    if (counts[sym] > 1) result += counts[sym];
                }
                return result;
            }

            function isValidCompound(composition) {
                if (!composition || composition.length < 2) return true;
                const tokens = tokenize(composition);
                
                const allMetals = tokens.every(sym => {
                    const data = elementData[sym];
                    return data && data.type === 'металл';
                });
                
                if (allMetals && tokens.length >= 2) {
                    return true;
                }
                
                for (let j = 0; j < tokens.length - 1; j++) {
                    if (tokens[j] === tokens[j+1]) {
                        if (tokens[j] === 'O' && tokens.length === 2) continue;
                        if (tokens[j] === 'N' && tokens.length === 2) continue;
                        if (tokens[j] === 'H' && tokens.length === 2) continue;
                        if (tokens[j] === 'C' && tokens.length === 2) continue;
                        return false;
                    }
                }
                
                let totalVal = 0;
                let hasNonMetal = false;
                for (const sym of tokens) {
                    const data = elementData[sym];
                    if (data && data.type !== 'металл' && data.type !== 'благородный газ') {
                        hasNonMetal = true;
                    }
                    const v = valenceMap[sym] || 0;
                    totalVal += v;
                }
                
                if (hasNonMetal && totalVal % 2 !== 0 && !tokens.includes('H')) {
                    return false;
                }
                
                return true;
            }

            function tryMerge(comp1, comp2) {
                const canon1 = canonicalFormula(comp1);
                const canon2 = canonicalFormula(comp2);
                
                if (canon1 === canon2) {
                    const counts = countAtoms(comp1);
                    let result = '';
                    const sorted = Object.keys(counts).sort();
                    for (const sym of sorted) {
                        result += sym;
                        const newCount = counts[sym] * 2;
                        if (newCount > 1) result += newCount;
                    }
                    return result;
                }

                const combined1 = comp1 + comp2;
                const combined2 = comp2 + comp1;
                
                const tokens1 = tokenize(combined1);
                const tokens2 = tokenize(combined2);
                
                const allMetals1 = tokens1.every(sym => {
                    const data = elementData[sym];
                    return data && data.type === 'металл';
                });
                
                const allMetals2 = tokens2.every(sym => {
                    const data = elementData[sym];
                    return data && data.type === 'металл';
                });
                
                if (allMetals1 && tokens1.length >= 2) {
                    const counts = countAtoms(combined1);
                    let result = '';
                    const sorted = Object.keys(counts).sort();
                    for (const sym of sorted) {
                        result += sym;
                        if (counts[sym] > 1) result += counts[sym];
                    }
                    return result;
                }
                
                if (allMetals2 && tokens2.length >= 2) {
                    const counts = countAtoms(combined2);
                    let result = '';
                    const sorted = Object.keys(counts).sort();
                    for (const sym of sorted) {
                        result += sym;
                        if (counts[sym] > 1) result += counts[sym];
                    }
                    return result;
                }
                
                if (isValidCompound(combined1)) {
                    return buildFormula(tokenize(combined1));
                }
                if (isValidCompound(combined2)) {
                    return buildFormula(tokenize(combined2));
                }
                
                return null;
            }

            function getSubstanceType(tokens, counts) {
                const uniqueElements = Object.keys(counts);
                const hasO = 'O' in counts;
                const hasH = 'H' in counts;
                const hasC = 'C' in counts;
                const hasN = 'N' in counts;
                const hasCl = 'Cl' in counts;
                const hasF = 'F' in counts;

                const metals = uniqueElements.filter(sym => {
                    const data = elementData[sym];
                    if (!data) return false;
                    return data.type === 'металл';
                });

                const nonMetals = uniqueElements.filter(sym => {
                    const data = elementData[sym];
                    if (!data) return false;
                    return data.type === 'неметалл' || data.type === 'галоген' || data.type === 'металлоид';
                });

                if (metals.length >= 2 && nonMetals.length === 0) {
                    return { type: 'сплав', class: 'alloy' };
                }

                if (uniqueElements.length === 1) {
                    const data = elementData[uniqueElements[0]];
                    if (data && data.type === 'благородный газ') {
                        return { type: 'благородный газ', class: 'inorganic' };
                    }
                    if (data && data.type === 'металл') {
                        return { type: 'металл', class: 'inorganic' };
                    }
                }

                if (metals.length > 0 && nonMetals.length > 0) {
                    if (metals.length >= 2 && nonMetals.length === 1) {
                        return { type: 'интерметаллид', class: 'alloy' };
                    }
                    return { type: 'соль', class: 'salt' };
                }

                if (hasC && hasH) {
                    if (uniqueElements.length <= 4) {
                        return { type: 'органическое', class: 'organic' };
                    }
                    return { type: 'органическое (сложное)', class: 'organic' };
                }

                if (hasH && hasO && nonMetals.length >= 1) {
                    const acidCenter = nonMetals.find(s => s !== 'O' && s !== 'H');
                    if (acidCenter) {
                        return { type: 'кислота', class: 'acid' };
                    }
                }

                if (hasO && uniqueElements.length === 2) {
                    const other = uniqueElements.find(s => s !== 'O');
                    if (other) {
                        const otherData = elementData[other];
                        if (otherData && otherData.type === 'металл') {
                            return { type: 'основный оксид', class: 'oxide' };
                        }
                        if (otherData && (otherData.type === 'неметалл' || otherData.type === 'металлоид')) {
                            return { type: 'кислотный оксид', class: 'oxide' };
                        }
                        return { type: 'оксид', class: 'oxide' };
                    }
                }

                if (hasH && uniqueElements.length === 2) {
                    const other = uniqueElements.find(s => s !== 'H');
                    if (other) {
                        const otherData = elementData[other];
                        if (otherData && otherData.type === 'металл') {
                            return { type: 'металлогидрид', class: 'hydride' };
                        }
                        return { type: 'гидрид', class: 'hydride' };
                    }
                }

                if ((hasCl || hasF) && uniqueElements.length === 2) {
                    return { type: 'галогенид', class: 'inorganic' };
                }

                if (uniqueElements.length >= 3 && !hasC) {
                    const allMetals = uniqueElements.every(sym => {
                        const data = elementData[sym];
                        return data && data.type === 'металл';
                    });
                    if (allMetals) {
                        return { type: 'многокомпонентный сплав', class: 'alloy' };
                    }
                    return { type: 'неорганическое (сложное)', class: 'inorganic' };
                }

                if (uniqueElements.length >= 5) {
                    return { type: 'многокомпонентное', class: 'mixture' };
                }

                return { type: 'химическое соединение', class: 'inorganic' };
            }

            function getState(tokens, counts) {
                const uniqueElements = Object.keys(counts);
                const typeInfo = getSubstanceType(tokens, counts);
                
                if (typeInfo.type === 'сплав' || typeInfo.type === 'интерметаллид' || typeInfo.type === 'многокомпонентный сплав') {
                    return 'твёрдое';
                }
                
                if (uniqueElements.length === 1) {
                    const data = elementData[uniqueElements[0]];
                    return data ? data.state : 'твёрдое';
                }

                const hasLiquid = uniqueElements.some(sym => {
                    const data = elementData[sym];
                    return data && data.state === 'жидкое';
                });

                const hasGas = uniqueElements.some(sym => {
                    const data = elementData[sym];
                    return data && data.state === 'газ';
                });

                const hasSolid = uniqueElements.some(sym => {
                    const data = elementData[sym];
                    return data && data.state === 'твёрдое';
                });

                if (typeInfo.type === 'кислота') {
                    const hasCl = 'Cl' in counts;
                    const hasBr = 'Br' in counts;
                    const hasI = 'I' in counts;
                    const hasF = 'F' in counts;
                    const hasS = 'S' in counts;
                    
                    if (hasCl && counts['Cl'] === 1 && counts['H'] === 1) return 'газ';
                    if (hasBr && counts['Br'] === 1 && counts['H'] === 1) return 'газ';
                    if (hasI && counts['I'] === 1 && counts['H'] === 1) return 'газ';
                    if (hasF && counts['F'] === 1 && counts['H'] === 1) return 'газ';
                    if (hasS && counts['S'] === 1 && counts['H'] === 2) return 'газ';
                    return 'жидкое';
                }

                if (counts['H'] && counts['O'] && counts['H'] === 2 && counts['O'] === 1 && uniqueElements.length === 2) {
                    return 'жидкое';
                }

                if (typeInfo.type === 'органическое' || typeInfo.type === 'органическое (сложное)') {
                    const hasO = 'O' in counts;
                    if (hasO && counts['C'] >= 1) {
                        if (counts['C'] <= 4) return 'жидкое';
                        return 'твёрдое';
                    }
                    const cCount = counts['C'] || 0;
                    const hCount = counts['H'] || 0;
                    if (cCount <= 4 && hCount === cCount * 2 + 2) return 'газ';
                    if (cCount === 5 && hCount === 12) return 'жидкое';
                    if (cCount >= 6 && hCount === cCount * 2 + 2) return 'жидкое';
                    if (cCount >= 17) return 'твёрдое';
                    if (cCount <= 4 && hCount === cCount * 2) return 'газ';
                    if (cCount >= 5 && hCount === cCount * 2) return 'жидкое';
                    if (cCount <= 4 && hCount === cCount * 2 - 2) return 'газ';
                    if (cCount >= 5 && hCount === cCount * 2 - 2) return 'жидкое';
                    if (cCount === 6 && hCount === 6 && !hasO) return 'жидкое';
                    if (cCount === 6 && hCount === 12) return 'жидкое';
                    return 'жидкое';
                }

                if (typeInfo.type === 'оксид' || typeInfo.type === 'основный оксид' || typeInfo.type === 'кислотный оксид') {
                    const other = uniqueElements.find(s => s !== 'O');
                    if (other) {
                        const otherData = elementData[other];
                        if (otherData && (otherData.type === 'неметалл' || otherData.type === 'галоген')) {
                            if (other === 'C' && counts['O'] === 2) return 'газ';
                            if (other === 'S' && counts['O'] === 2) return 'газ';
                            if (other === 'N' && counts['O'] === 2) return 'газ';
                            if (other === 'Cl' && counts['O'] === 1) return 'газ';
                            if (other === 'P' && counts['O'] === 3) return 'твёрдое';
                            if (other === 'Si' && counts['O'] === 2) return 'твёрдое';
                            return 'газ';
                        }
                        return 'твёрдое';
                    }
                    return 'твёрдое';
                }

                if (typeInfo.type === 'соль') {
                    return 'твёрдое';
                }

                if (typeInfo.type === 'галогенид') {
                    const hasMetal = uniqueElements.some(sym => {
                        const data = elementData[sym];
                        return data && data.type === 'металл';
                    });
                    if (hasMetal) return 'твёрдое';
                    if (counts['P'] && counts['Cl']) {
                        if (counts['Cl'] === 3) return 'жидкое';
                        if (counts['Cl'] === 5) return 'твёрдое';
                    }
                    if (counts['Si'] && counts['Cl'] === 4) return 'жидкое';
                    return 'газ';
                }

                if (typeInfo.type === 'hydride' || typeInfo.type === 'металлогидрид') {
                    const other = uniqueElements.find(s => s !== 'H');
                    if (other) {
                        const otherData = elementData[other];
                        if (otherData && otherData.type === 'металл') {
                            return 'твёрдое';
                        }
                        if (other === 'N' || other === 'P' || other === 'As' || other === 'Sb') {
                            return 'газ';
                        }
                        if (other === 'S') return 'газ';
                        if (other === 'Se') return 'газ';
                        if (other === 'Te') return 'газ';
                        if (other === 'Si' || other === 'Ge' || other === 'Sn') return 'газ';
                        if (other === 'B') return 'газ';
                        return 'газ';
                    }
                }

                if (hasLiquid) {
                    if (hasSolid && !hasGas) {
                        if (uniqueElements.some(s => s === 'Hg')) {
                            const otherMetals = uniqueElements.filter(s => s !== 'Hg' && elementData[s]?.type === 'металл');
                            if (otherMetals.length > 0) return 'твёрдое';
                        }
                        return 'жидкое';
                    }
                    if (hasGas && hasSolid) {
                        const gasCount = uniqueElements.filter(sym => {
                            const data = elementData[sym];
                            return data && data.state === 'газ';
                        }).length;
                        const solidCount = uniqueElements.filter(sym => {
                            const data = elementData[sym];
                            return data && data.state === 'твёрдое';
                        }).length;
                        if (gasCount > solidCount) return 'газ';
                        return 'твёрдое';
                    }
                    return 'жидкое';
                }

                if (hasGas && !hasSolid && !hasLiquid) return 'газ';

                if (hasGas && hasSolid) {
                    const hasMetal = uniqueElements.some(sym => {
                        const data = elementData[sym];
                        return data && data.type === 'металл';
                    });
                    if (hasMetal) return 'твёрдое';
                    if (uniqueElements.some(s => s === 'O')) {
                        const nonMetalOxide = uniqueElements.some(s => {
                            const data = elementData[s];
                            return data && (data.type === 'неметалл' || data.type === 'галоген');
                        });
                        if (nonMetalOxide) return 'газ';
                    }
                    return 'твёрдое';
                }

                return 'твёрдое';
            }

            // ---- ГЕНЕРАЦИЯ НАЗВАНИЯ ----
            function generateCompoundName(composition) {
                if (!composition) return 'Неизвестный';
                
                const tokens = tokenize(composition);
                if (tokens.length === 0) return 'Пусто';
                if (tokens.length === 1) {
                    const data = elementData[tokens[0]];
                    return data ? data.rus : tokens[0];
                }

                const counts = countAtoms(composition);
                const uniqueElements = Object.keys(counts);
                const typeInfo = getSubstanceType(tokens, counts);
                const state = getState(tokens, counts);
                
                const hasO = 'O' in counts;
                const hasH = 'H' in counts;
                const hasC = 'C' in counts;
                const hasN = 'N' in counts;
                const hasCl = 'Cl' in counts;
                const hasF = 'F' in counts;

                const metals = uniqueElements.filter(sym => {
                    const data = elementData[sym];
                    if (!data) return false;
                    return data.type === 'металл';
                });

                const nonMetals = uniqueElements.filter(sym => {
                    const data = elementData[sym];
                    if (!data) return false;
                    return data.type === 'неметалл' || data.type === 'галоген' || data.type === 'металлоид';
                });

                let name = '';

                if (typeInfo.type === 'сплав' || typeInfo.type === 'интерметаллид' || typeInfo.type === 'многокомпонентный сплав') {
                    const metalNames = metals.map(s => elementData[s]?.rus || s);
                    if (metalNames.length === 2) {
                        name = `${metalNames[0]}-${metalNames[1]} сплав`;
                    } else if (metalNames.length === 3) {
                        name = `${metalNames[0]}-${metalNames[1]}-${metalNames[2]} сплав`;
                    } else {
                        name = `${metalNames.join('-')} сплав`;
                    }
                    return name;
                }

                if (typeInfo.type === 'благородный газ') {
                    const data = elementData[uniqueElements[0]];
                    return `${data?.rus || uniqueElements[0]}`;
                }

                if (typeInfo.type === 'металл') {
                    const data = elementData[uniqueElements[0]];
                    return `${data?.rus || uniqueElements[0]}`;
                }

                if (typeInfo.type === 'оксид' || typeInfo.type === 'основный оксид' || typeInfo.type === 'кислотный оксид') {
                    const other = uniqueElements.find(s => s !== 'O');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        const oCount = counts['O'] || 0;
                        const otherCount = counts[other] || 0;
                        const prefixMap = { '1': 'моно', '2': 'ди', '3': 'три', '4': 'тетра', '5': 'пента', '6': 'гекса' };
                        const oxPrefix = prefixMap[oCount] || '';
                        const otherPrefix = prefixMap[otherCount] || '';
                        const otherData = elementData[other];
                        if (otherData && (otherData.type === 'металл')) {
                            name = `${otherPrefix}${otherName} ${oxPrefix}оксид`;
                        } else {
                            name = `${otherPrefix}${otherName} ${oxPrefix}оксид`;
                        }
                        return name.trim();
                    }
                }

                if (typeInfo.type === 'кислота') {
                    const acidCenter = nonMetals.find(s => s !== 'O' && s !== 'H');
                    if (acidCenter) {
                        const acidMap = {
                            'S': 'Серная кислота',
                            'N': 'Азотная кислота',
                            'Cl': 'Хлорная кислота',
                            'C': 'Угольная кислота',
                            'P': 'Фосфорная кислота',
                            'Si': 'Кремниевая кислота'
                        };
                        name = acidMap[acidCenter] || `${elementData[acidCenter]?.rus || acidCenter}ная кислота`;
                        return name;
                    }
                }

                if (typeInfo.type === 'соль') {
                    if (metals.length > 0 && nonMetals.length > 0) {
                        const metalName = elementData[metals[0]]?.rus || metals[0];
                        const nonMetal = nonMetals[0];
                        const suffixMap = { 'Cl': 'хлорид', 'F': 'фторид', 'O': 'оксид', 'S': 'сульфид', 'N': 'нитрид', 'C': 'карбид' };
                        const suffix = suffixMap[nonMetal] || `${elementData[nonMetal]?.rus || nonMetal}ид`;
                        const metalCount = counts[metals[0]] || 1;
                        const prefixMap = { '1': '', '2': 'ди', '3': 'три', '4': 'тетра', '5': 'пента' };
                        const metalPrefix = prefixMap[metalCount] || '';
                        name = `${suffix} ${metalPrefix}${metalName}`;
                        return name.trim();
                    }
                }

                if (typeInfo.type === 'гидрид' || typeInfo.type === 'металлогидрид') {
                    const other = uniqueElements.find(s => s !== 'H');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        const hCount = counts['H'] || 1;
                        const prefixMap = { '1': '', '2': 'ди', '3': 'три', '4': 'тетра' };
                        const hPrefix = prefixMap[hCount] || '';
                        name = `${hPrefix}гидрид ${otherName}`;
                        return name.trim();
                    }
                }

                if (typeInfo.type === 'галогенид') {
                    const other = uniqueElements.find(s => s !== 'Cl' && s !== 'F' && s !== 'Br' && s !== 'I');
                    if (other) {
                        const otherName = elementData[other]?.rus || other;
                        let halogen = '';
                        if (hasCl) halogen = 'хлорид';
                        else if (hasF) halogen = 'фторид';
                        else if (hasBr) halogen = 'бромид';
                        else if (hasI) halogen = 'иодид';
                        const halogenCount = counts[hasCl ? 'Cl' : hasF ? 'F' : hasBr ? 'Br' : 'I'] || 1;
                        const prefixMap = { '1': '', '2': 'ди', '3': 'три', '4': 'тетра' };
                        const hPrefix = prefixMap[halogenCount] || '';
                        name = `${hPrefix}${halogen} ${otherName}`;
                        return name.trim();
                    }
                }

                if (typeInfo.type === 'органическое' || typeInfo.type === 'органическое (сложное)') {
                    const cCount = counts['C'] || 0;
                    const hCount = counts['H'] || 0;
                    const hasOOrg = hasO || false;
                    const hasNOrg = hasN || false;
                    
                    if (cCount === 1 && hCount >= 4 && !hasOOrg && !hasNOrg) return `Метан`;
                    if (cCount === 1 && hCount >= 4 && hasOOrg && !hasNOrg) return `Метанол`;
                    if (cCount === 2 && hCount >= 6 && !hasOOrg && !hasNOrg) return `Этан`;
                    if (cCount === 2 && hCount >= 6 && hasOOrg && !hasNOrg) return `Этанол`;
                    if (cCount === 3 && hCount >= 8 && !hasOOrg && !hasNOrg) return `Пропан`;
                    if (cCount === 3 && hCount >= 8 && hasOOrg && !hasNOrg) return `Пропанол`;
                    if (cCount === 6 && hCount >= 12) {
                        if (hasOOrg && !hasNOrg && hCount === 12) return `Фенол`;
                        if (!hasOOrg && !hasNOrg && hCount === 6) return `Бензол`;
                        return `Циклогексан`;
                    }
                    if (cCount >= 4 && !hasOOrg && !hasNOrg) {
                        const prefixes = ['', 'Мет', 'Эт', 'Проп', 'Бут', 'Пент', 'Гекс', 'Гепт', 'Окт', 'Нон', 'Дек'];
                        const prefix = cCount < prefixes.length ? prefixes[cCount] : `C${cCount}`;
                        if (hCount === cCount * 2 + 2) return `${prefix}ан`;
                        if (hCount === cCount * 2) return `${prefix}ен`;
                        if (hCount === cCount * 2 - 2) return `${prefix}ин`;
                        return `Углеводород C${cCount}H${hCount}`;
                    }
                    if (cCount >= 2 && hasOOrg && hCount >= 2) {
                        const prefixes = ['', 'Мет', 'Эт', 'Проп', 'Бут', 'Пент', 'Гекс', 'Гепт', 'Окт', 'Нон', 'Дек'];
                        const prefix = cCount < prefixes.length ? prefixes[cCount] : `C${cCount}`;
                        return `${prefix}анол`;
                    }
                    const parts = uniqueElements.map(sym => {
                        const name = elementData[sym]?.rus || sym;
                        const count = counts[sym];
                        return count > 1 ? `${name}(${count})` : name;
                    });
                    return `Органическое соединение: ${parts.join(' + ')}`;
                }

                if (typeInfo.type === 'неорганическое (сложное)') {
                    const parts = uniqueElements.map(sym => {
                        const name = elementData[sym]?.rus || sym;
                        const count = counts[sym];
                        return count > 1 ? `${name}(${count})` : name;
                    });
                    return `Неорганическое соединение: ${parts.join(' + ')}`;
                }

                if (typeInfo.type === 'многокомпонентное') {
                    const parts = uniqueElements.map(sym => {
                        const name = elementData[sym]?.rus || sym;
                        const count = counts[sym];
                        return count > 1 ? `${name}(${count})` : name;
                    });
                    return `Многокомпонентное: ${parts.join(' + ')}`;
                }

                const parts = uniqueElements.map(sym => {
                    const name = elementData[sym]?.rus || sym;
                    const count = counts[sym];
                    return count > 1 ? `${name}(${count})` : name;
                });
                return `${parts.join(' + ')}`;
            }

            // ---- ПРИМЕНЕНИЕ КОЭФФИЦИЕНТА ----
            function applyCoefficient(composition, coeff, side) {
                const tokens = tokenize(composition);
                const counts = {};
                let i = 0;
                while (i < tokens.length) {
                    const sym = tokens[i];
                    let count = 1;
                    if (i+1 < tokens.length && !isNaN(tokens[i+1])) {
                        count = parseInt(tokens[i+1]);
                        i++;
                    }
                    counts[sym] = (counts[sym] || 0) + count;
                    i++;
                }

                if (side === 'left') {
                    return `${coeff}${composition}`;
                } else {
                    let result = '';
                    const sorted = Object.keys(counts).sort();
                    for (const sym of sorted) {
                        result += sym;
                        const newCount = counts[sym] * coeff;
                        if (newCount > 1) result += newCount;
                    }
                    return result;
                }
            }

            // ---- ОСНОВНЫЕ ПЕРЕМЕННЫЕ ----
            let chemObjects = [];
            const workspace = document.getElementById('workspace');
            const grid = document.getElementById('periodicGrid');

            // ---- ФОРМАТИРОВАНИЕ ФОРМУЛЫ ----
            function formatFormula(composition) {
                const tokens = tokenize(composition);
                const counts = {};
                let i = 0;
                while (i < tokens.length) {
                    const sym = tokens[i];
                    let count = 1;
                    if (i+1 < tokens.length && !isNaN(tokens[i+1])) {
                        count = parseInt(tokens[i+1]);
                        i++;
                    }
                    counts[sym] = (counts[sym] || 0) + count;
                    i++;
                }
                let result = '';
                const sorted = Object.keys(counts).sort();
                for (const sym of sorted) {
                    result += sym;
                    if (counts[sym] > 1) result += counts[sym];
                }
                return result;
            }

            // ---- ПОЛУЧЕНИЕ ДАННЫХ ДЛЯ ПОДСКАЗКИ ----
            function getTooltipData(symbol, composition) {
                const isCompound = composition && composition.length > 1;
                const base = elementData[symbol] || { name: 'Неизвестный', mass: '?', group: '?', rus: symbol };
                
                const tokens = composition ? tokenize(composition) : [symbol];
                const counts = composition ? countAtoms(composition) : { [symbol]: 1 };
                const uniqueElements = Object.keys(counts);
                
                let molecularMass = 0;
                let totalProtons = 0;
                let totalAtoms = 0;
                const atomDetails = [];
                
                for (const [sym, count] of Object.entries(counts)) {
                    const data = elementData[sym];
                    const mass = data && data.mass !== '?' ? parseFloat(data.mass) : 0;
                    if (!isNaN(mass)) {
                        molecularMass += mass * count;
                    }
                    const protonCount = atomicNumbers[sym] || 0;
                    totalProtons += protonCount * count;
                    totalAtoms += count;
                    atomDetails.push({
                        symbol: sym,
                        name: data ? data.rus : sym,
                        count: count,
                        mass: mass,
                        protons: protonCount,
                        atomicMass: data ? data.mass : '?'
                    });
                }
                
                let typeInfo = { type: 'элемент', class: 'inorganic' };
                let state = 'твёрдое';
                let fullName = '';
                let chemicalName = '';
                
                if (isCompound && tokens.length > 0) {
                    typeInfo = getSubstanceType(tokens, counts);
                    state = getState(tokens, counts);
                    fullName = generateCompoundName(composition);
                    chemicalName = fullName;
                } else if (!isCompound) {
                    const data = elementData[symbol];
                    state = data ? data.state : 'твёрдое';
                    typeInfo = { type: data ? data.type : 'элемент', class: 'inorganic' };
                    fullName = data ? data.rus : symbol;
                    chemicalName = data ? data.rus : symbol;
                }
                
                let formulaWithSubscripts = '';
                const sorted = Object.keys(counts).sort();
                for (const sym of sorted) {
                    formulaWithSubscripts += sym;
                    if (counts[sym] > 1) formulaWithSubscripts += counts[sym];
                }
                
                return {
                    symbol: symbol,
                    composition: composition || symbol,
                    isCompound: isCompound,
                    fullName: fullName.charAt(0).toUpperCase() + fullName.slice(1),
                    chemicalName: chemicalName,
                    formula: formulaWithSubscripts,
                    type: typeInfo.type,
                    typeClass: typeInfo.class,
                    state: state,
                    elements: counts,
                    uniqueElements: uniqueElements,
                    totalAtoms: totalAtoms,
                    molecularMass: molecularMass.toFixed(3),
                    totalProtons: totalProtons,
                    atomDetails: atomDetails,
                    valence: valenceMap[composition] || valenceMap[symbol] || 0
                };
            }

                if (data.isCompound && data.uniqueElements.length > 0) {

                if (top + th > window.innerHeight - 10) top = e.clientY - th - 10;
                if (left < 10) left = 10;
                if (top < 10) top = 10;

            // ---- СОЗДАНИЕ ОБЪЕКТА ----
            function createChemObject(symbol, x, y, composition) {
                const el = document.createElement('div');
                el.className = 'chem-object';
                const comp = composition || symbol;
                const displayText = comp.length > 15 ? comp.substring(0, 12) + '…' : comp;
                el.textContent = displayText;
                el.dataset.symbol = symbol;
                el.dataset.composition = comp;
                el.dataset.fullComposition = comp;
                
                const tokens = tokenize(comp);
                const unique = new Set(tokens);
                
                const allMetals = tokens.every(sym => {
                    const data = elementData[sym];
                    return data && data.type === 'металл';
                });
                
                if (allMetals && tokens.length >= 2) {
                    el.classList.add('alloy');
                } else if (unique.size >= 6) {
                    el.classList.add('mega-compound');
                } else if (comp.length > 2) {
                    el.classList.add('compound');
                }
                
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                workspace.appendChild(el);
                chemObjects.push(el);
                attachDragEvents(el);
                attachTooltipEvents(el);
                updateStats();
                return el;
            }

            // ---- ОТТАЛКИВАНИЕ ----
            function pushAway(el) {
                const elRect = el.getBoundingClientRect();
                const wsRect = workspace.getBoundingClientRect();
                const elCenterX = elRect.left + elRect.width/2;
                const elCenterY = elRect.top + elRect.height/2;
                const pushRadius = 120;
                const forceMultiplier = 2.0;

                let dxTotal = 0, dyTotal = 0;

                for (let other of chemObjects) {
                    if (other === el) continue;
                    const otherRect = other.getBoundingClientRect();
                    const otherCenterX = otherRect.left + otherRect.width/2;
                    const otherCenterY = otherRect.top + otherRect.height/2;
                    
                    const dx = otherCenterX - elCenterX;
                    const dy = otherCenterY - elCenterY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < pushRadius && dist > 1) {
                        const force = (pushRadius - dist) / pushRadius * forceMultiplier;
                        const angle = Math.atan2(dy, dx);
                        dxTotal -= Math.cos(angle) * force;
                        dyTotal -= Math.sin(angle) * force;
                    }
                }

                if (dxTotal !== 0 || dyTotal !== 0) {
                    const currentX = parseFloat(el.style.left) || 0;
                    const currentY = parseFloat(el.style.top) || 0;
                    let newX = currentX + dxTotal * 15;
                    let newY = currentY + dyTotal * 15;
                    
                    newX = Math.max(0, Math.min(wsRect.width - el.offsetWidth, newX));
                    newY = Math.max(0, Math.min(wsRect.height - el.offsetHeight, newY));
                    
                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                    
                    setTimeout(() => {
                        const currentX2 = parseFloat(el.style.left) || 0;
                        const currentY2 = parseFloat(el.style.top) || 0;
                        let newX2 = currentX2 + dxTotal * 5;
                        let newY2 = currentY2 + dyTotal * 5;
                        newX2 = Math.max(0, Math.min(wsRect.width - el.offsetWidth, newX2));
                        newY2 = Math.max(0, Math.min(wsRect.height - el.offsetHeight, newY2));
                        el.style.left = newX2 + 'px';
                        el.style.top = newY2 + 'px';
                    }, 50);
                }
            }

            // ---- ПРОВЕРКА СЛИЯНИЯ ----
            function checkAndMerge(draggedEl) {
                if (draggedEl.dataset.type === 'coefficient') {
                    const coeff = parseInt(draggedEl.dataset.coefficient);
                    const dragRect = draggedEl.getBoundingClientRect();
                    const dragCenterX = (dragRect.left + dragRect.right) / 2;
                    let targetFound = false;

                    for (let other of chemObjects) {
                        if (other === draggedEl) continue;
                        if (other.dataset.type === 'coefficient') continue;
                        
                        const otherRect = other.getBoundingClientRect();
                        const overlap = !(dragRect.right < otherRect.left || 
                                         dragRect.left > otherRect.right || 
                                         dragRect.bottom < otherRect.top || 
                                         dragRect.top > otherRect.bottom);
                        if (!overlap) continue;

                        const otherCenterX = (otherRect.left + otherRect.right) / 2;
                        const side = dragCenterX < otherCenterX ? 'left' : 'right';
                        
                        const comp = other.dataset.composition || other.dataset.symbol;
                        const newComp = applyCoefficient(comp, coeff, side);
                        
                        if (isValidCompound(newComp) || newComp.length === comp.length + 1) {
                            const wsRect = workspace.getBoundingClientRect();
                            const newX = Math.max(0, Math.min(wsRect.width - 60, 
                                (otherRect.left + otherRect.right) / 2 - 30 - wsRect.left));
                            const newY = Math.max(0, Math.min(wsRect.height - 30, 
                                (otherRect.top + otherRect.bottom) / 2 - 15 - wsRect.top));
                            
                            removeObject(draggedEl);
                            removeObject(other);
                            
                            const firstSymbol = newComp[0] || '?';
                            const newEl = createChemObject(firstSymbol, newX, newY, newComp);
                            
                            const tokens = tokenize(newComp);
                            let maxVal = 0;
                            for (const sym of tokens) {
                                const v = valenceMap[sym] || 0;
                                if (v > maxVal) maxVal = v;
                            }
                            valenceMap[newComp] = maxVal;
                            
                            targetFound = true;
                            break;
                        }
                    }

                    if (!targetFound && draggedEl.parentNode) {
                        draggedEl.classList.add('reject');
                        pushAway(draggedEl);
                        setTimeout(() => {
                            if (draggedEl.parentNode) {
                                draggedEl.classList.remove('reject');
                            }
                        }, 2000);
                    }
                    return;
                }

                const dragRect = draggedEl.getBoundingClientRect();
                const dragComposition = draggedEl.dataset.composition || draggedEl.dataset.symbol;
                let merged = false;

                for (let other of chemObjects) {
                    if (other === draggedEl) continue;
                    if (other.dataset.type === 'coefficient') continue;
                    
                    const otherRect = other.getBoundingClientRect();
                    const overlap = !(dragRect.right < otherRect.left || 
                                     dragRect.left > otherRect.right || 
                                     dragRect.bottom < otherRect.top || 
                                     dragRect.top > otherRect.bottom);
                    if (!overlap) continue;

                    const otherComposition = other.dataset.composition || other.dataset.symbol;
                    
                    let newComposition = tryMerge(dragComposition, otherComposition);
                    
                    if (newComposition) {
                        const centerX = (dragRect.left + dragRect.right) / 2 - 30;
                        const centerY = (dragRect.top + dragRect.bottom) / 2 - 15;
                        const wsRect = workspace.getBoundingClientRect();
                        const newX = Math.max(0, Math.min(wsRect.width - 60, centerX - wsRect.left));
                        const newY = Math.max(0, Math.min(wsRect.height - 30, centerY - wsRect.top));

                        removeObject(draggedEl);
                        removeObject(other);

                        const firstSymbol = newComposition[0] || '?';
                        const newEl = createChemObject(firstSymbol, newX, newY, newComposition);
                        
                        let maxVal = 0;
                        const tokens = tokenize(newComposition);
                        for (const sym of tokens) {
                            const v = valenceMap[sym] || 0;
                            if (v > maxVal) maxVal = v;
                        }
                        valenceMap[newComposition] = maxVal;
                        merged = true;
                        break;
                    }
                }

                if (!merged && draggedEl.parentNode) {
                    draggedEl.classList.add('reject');
                    pushAway(draggedEl);
                    
                    setTimeout(() => {
                        if (draggedEl.parentNode) {
                            pushAway(draggedEl);
                        }
                    }, 100);
                    
                    if (window.rejectTimer) clearTimeout(window.rejectTimer);
                    window.rejectTimer = setTimeout(() => {
                        if (draggedEl.parentNode) {
                            draggedEl.classList.remove('reject');
                        }
                        window.rejectTimer = null;
                    }, 2000);
                }

                return merged;
            }

            // ---- ПЕРЕТАСКИВАНИЕ ----
            function attachDragEvents(el) {
                let isDragging = false;
                let startX, startY, origX, origY;

                const onStart = (e) => {
                    e.preventDefault();
                    const ev = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    el.classList.add('dragging');
                    const rect = el.getBoundingClientRect();
                    origX = rect.left;
                    origY = rect.top;
                    startX = ev.clientX;
                    startY = ev.clientY;
                    el.style.zIndex = 100;
                    hideTooltip();
                    el.classList.remove('reject');

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd, { passive: false });
                };

                const onMove = (e) => {
                    e.preventDefault();
                    if (!isDragging) return;
                    const ev = e.touches ? e.touches[0] : e;
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    const wsRect = workspace.getBoundingClientRect();
                    let newX = origX + dx - wsRect.left;
                    let newY = origY + dy - wsRect.top;
                    newX = Math.max(0, Math.min(wsRect.width - el.offsetWidth, newX));
                    newY = Math.max(0, Math.min(wsRect.height - el.offsetHeight, newY));
                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                };

                const onEnd = (e) => {
                    if (isDragging) {
                        isDragging = false;
                        el.classList.remove('dragging');
                        el.style.zIndex = 20;
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        
                        checkAndMerge(el);
                    }
                };

                el.addEventListener('mousedown', onStart);
                el.addEventListener('touchstart', onStart, { passive: false });
            }

            // ---- УДАЛЕНИЕ ----
            function removeObject(el) {
                const index = chemObjects.indexOf(el);
                if (index !== -1) {
                    chemObjects.splice(index, 1);
                }
                if (el.parentNode) el.parentNode.removeChild(el);
                updateStats();
            }

            // ---- ОЧИСТКА ----
            function clearWorkspace() {
                for (let i = chemObjects.length - 1; i >= 0; i--) {
                    const el = chemObjects[i];
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
                chemObjects = [];
                for (const key in valenceMap) {
                    if (key.length > 2) {
                        delete valenceMap[key];
                    }
                }
                updateStats();
            }

            clearBtn.addEventListener('click', clearWorkspace);

            // ---- СОЗДАНИЕ ЭЛЕМЕНТА ПО КЛИКУ ----
            grid.addEventListener('click', (e) => {
                const cell = e.target.closest('.element-cell[data-symbol]');
                if (!cell) return;
                const symbol = cell.dataset.symbol;
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createChemObject(symbol, x, y, symbol);
            });

            // ---- СОЗДАНИЕ КОЭФФИЦИЕНТА ПО КЛИКУ ----
            coeffGrid.addEventListener('click', (e) => {
                const cell = e.target.closest('.coeff-cell');
                if (!cell) return;
                const value = parseInt(cell.dataset.value);
                const wsRect = workspace.getBoundingClientRect();
                const x = 20 + Math.random() * (wsRect.width - 60);
                const y = 20 + Math.random() * (wsRect.height - 60);
                createCoefficient(value, x, y);
            });

            // ---- СКРЫВАЕМ ПОДСКАЗКИ ----
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.chem-object') && !e.target.closest('.element-cell') && !e.target.closest('.coeff-cell')) {
                    hideTooltip();
                    hideElementTooltip();
                }
            });

            // ---- ДЕМО ----
            function initDemo() {
                const wsRect = workspace.getBoundingClientRect();
                const demoElements = ['Fe', 'Mg', 'Cu', 'Al', 'Ti', 'H', 'O', 'C', 'N', 'Cl'];
                const positions = [
                    {x: 80, y: 60}, {x: 160, y: 60}, {x: 240, y: 60},
                    {x: 80, y: 130}, {x: 160, y: 130},
                    {x: 320, y: 60}, {x: 400, y: 60}, {x: 480, y: 60},
                    {x: 320, y: 130}, {x: 400, y: 130}
                ];
                demoElements.forEach((sym, i) => {
                    const pos = positions[i] || {x: 100 + i * 50, y: 100 + i * 20};
                    createChemObject(sym, pos.x, pos.y, sym);
                });
                
                setTimeout(() => {
                    const compounds = [
                        { comp: 'FeMg', label: 'Fe-Mg' },
                        { comp: 'CuAl', label: 'Cu-Al' },
                        { comp: 'FeTi', label: 'Fe-Ti' },
                        { comp: 'H2O', label: 'H₂O' },
                        { comp: 'NaCl', label: 'NaCl' },
                        { comp: 'C2H5OH', label: 'C₂H₅OH' },
                        { comp: 'Fe2O3', label: 'Fe₂O₃' },
                        { comp: 'H2SO4', label: 'H₂SO₄' }
                    ];
                    compounds.forEach((c, i) => {
                        const x = 80 + i * 110;
                        const y = 280;
                        const el = createChemObject(c.comp[0], x, y, c.comp);
                        el.textContent = c.label;
                        if (c.comp.length === 2 || c.comp.length === 3) {
                            const tokens = tokenize(c.comp);
                            const allMetals = tokens.every(sym => {
                                const data = elementData[sym];
                                return data && data.type === 'металл';
                            });
                            if (allMetals && tokens.length >= 2) {
                                el.classList.add('alloy');
                            } else {
                                el.classList.add('compound');
                            }
                        }
                    });
                }, 200);
            }

            setTimeout(initDemo, 100);
        })();
    </script>
